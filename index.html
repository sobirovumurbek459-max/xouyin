<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X & O Legend: Ultimate Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: #f8fafc; overflow: hidden; touch-action: manipulation; }
        .grid-cell { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); position: relative; }
        .grid-cell:active { transform: scale(0.9); }
        .boss-card { animation: boss-glow 2s infinite; border: 2px solid #ef4444 !important; }
        @keyframes boss-glow {
            0%, 100% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.3); }
            50% { box-shadow: 0 0 30px rgba(239, 68, 68, 0.6); }
        }
        .win-animate { background: #4f46e5 !important; animation: win-pulse 0.8s infinite; }
        @keyframes win-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .player-active-glow { ring: 4px solid #6366f1; background: rgba(99, 102, 241, 0.1); }
        .art-active { border-color: #f59e0b !important; background: rgba(245, 158, 11, 0.2); transform: scale(1.1); }
        .setup-btn-active { background: #4f46e5 !important; border-color: #818cf8 !important; }
    </style>
</head>
<body>
    <div id="app" class="h-screen max-w-md mx-auto flex flex-col bg-slate-950 relative">
        <div id="ui" class="flex-1 flex flex-col p-4 overflow-y-auto">
            <!-- Dinamik UI -->
        </div>
    </div>

    <script>
        // --- MA'LUMOTLAR VA HOLAT ---
        const BOSS_LEVELS = [5, 10, 15, 20, 25, 30];
        const DIFFICULTIES = ['OSON', 'O\'RTA', 'QIYIN', 'PRO', 'IMKONSIZ'];
        const PRICES = { eraser: 40, freeze: 60, shield: 50, meteor: 150 };

        let state = JSON.parse(localStorage.getItem('xo_legend_pro_v1')) || {
            view: 'menu',
            coins: 100,
            unlockedLevel: 1,
            inventory: { eraser: 2, freeze: 1, shield: 1, meteor: 0 },
            multiData: {
                coinsX: 100, coinsO: 100,
                invX: { eraser: 1, freeze: 1, shield: 1, meteor: 0 },
                invO: { eraser: 1, freeze: 1, shield: 1, meteor: 0 }
            }
        };

        let game = {
            mode: 'battle', // battle, robot, multi
            level: 1,
            diff: 'O\'RTA',
            gridSize: 3,
            board: [],
            isXNext: true,
            winner: null,
            bossHP: 0,
            maxBossHP: 0,
            frozen: null,
            shielded: [],
            activeArt: null,
            isThinking: false
        };

        // Setup uchun vaqtinchalik tanlovlar
        let setupTemp = { size: 3, diff: 'O\'RTA' };

        function save() {
            localStorage.setItem('xo_legend_pro_v1', JSON.stringify(state));
        }

        // --- NAVIGATSIYA ---
        window.nav = (v) => { state.view = v; render(); };

        window.startLevel = (lvl) => {
            game.mode = 'battle';
            game.level = lvl;
            game.gridSize = lvl <= 10 ? 3 : lvl <= 20 ? 4 : 5;
            game.diff = lvl <= 5 ? 'O\'RTA' : lvl <= 15 ? 'QIYIN' : 'PRO';
            game.maxBossHP = BOSS_LEVELS.includes(lvl) ? 3 : 0;
            game.bossHP = game.maxBossHP;
            initGame();
        };

        window.startRobotMode = () => {
            game.mode = 'robot';
            game.gridSize = setupTemp.size;
            game.diff = setupTemp.diff;
            game.bossHP = 0;
            initGame();
        };

        window.startMultiMode = () => {
            game.mode = 'multi';
            game.gridSize = setupTemp.size;
            game.diff = 'MULTIPLAYER';
            game.bossHP = 0;
            initGame();
        };

        function initGame() {
            game.board = Array(game.gridSize * game.gridSize).fill(null);
            game.isXNext = true;
            game.winner = null;
            game.frozen = null;
            game.shielded = [];
            game.activeArt = null;
            game.isThinking = false;
            state.view = 'game';
            render();
        }

        // --- O'YIN MANTIQLARI ---
        window.cellClick = (i) => {
            if (game.winner || game.isThinking) return;

            // Artefakt mantiqi
            if (game.activeArt) {
                applyArtLogic(i);
                return;
            }

            if (game.board[i]) return;

            game.board[i] = game.isXNext ? 'X' : 'O';
            const res = checkWin(game.board, game.gridSize);

            if (res) {
                game.winner = res;
            } else {
                switchTurn();
            }
            render();
        };

        function applyArtLogic(i) {
            const p = game.isXNext ? 'X' : 'O';
            const opp = game.isXNext ? 'O' : 'X';
            const inv = game.mode === 'multi' ? (p === 'X' ? state.multiData.invX : state.multiData.invO) : state.inventory;

            if (game.activeArt === 'eraser' && game.board[i] === opp && !game.shielded.includes(i)) {
                game.board[i] = null;
                inv.eraser--;
            } else if (game.activeArt === 'shield' && game.board[i] === p && !game.shielded.includes(i)) {
                game.shielded.push(i);
                inv.shield--;
            }
            game.activeArt = null;
            render();
        }

        function switchTurn() {
            const nextP = game.isXNext ? 'O' : 'X';
            if (game.frozen === nextP) {
                game.frozen = null;
            } else {
                game.isXNext = !game.isXNext;
                if (!game.isXNext && game.mode !== 'multi') {
                    game.isThinking = true;
                    setTimeout(robotMove, 700);
                }
            }
        }

        function checkWin(board, size) {
            const winLen = size === 3 ? 3 : 4;
            const dirs = [[0,1],[1,0],[1,1],[1,-1]];
            for(let r=0; r<size; r++) {
                for(let c=0; c<size; c++) {
                    const p = board[r*size+c];
                    if(!p) continue;
                    for(let [dr, dc] of dirs) {
                        let count = 1, line = [r*size+c];
                        for(let s=1; s<winLen; s++) {
                            const nr=r+dr*s, nc=c+dc*s;
                            if(nr>=0 && nr<size && nc>=0 && nc<size && board[nr*size+nc]===p) {
                                count++; line.push(nr*size+nc);
                            } else break;
                        }
                        if(count === winLen) return { p, line };
                    }
                }
            }
            if(!board.includes(null)) return { p: 'Durang', line: [] };
            return null;
        }

        // --- ROBOT AI ---
        function robotMove() {
            if (game.winner) { game.isThinking = false; return; }
            const empty = game.board.map((v, i) => v === null ? i : null).filter(v => v !== null);
            if (empty.length === 0) { game.isThinking = false; return; }

            // Impossible: AI uses Eraser
            if (game.diff === 'IMKONSIZ' && Math.random() > 0.7) {
                const xCells = game.board.map((v,i) => v==='X' ? i : null).filter(v => v!==null);
                if (xCells.length >= 3) {
                    const target = xCells[Math.floor(Math.random() * xCells.length)];
                    if (!game.shielded.includes(target)) {
                        game.board[target] = null;
                        game.isThinking = false;
                        render();
                        switchTurn();
                        return;
                    }
                }
            }

            let move = empty[Math.floor(Math.random() * empty.length)];
            if (game.diff !== 'OSON') {
                // Win check
                for (let i of empty) {
                    let test = [...game.board]; test[i] = 'O';
                    if (checkWin(test, game.gridSize)?.p === 'O') { move = i; break; }
                }
                // Block check
                if (game.board[move] !== 'O' && game.diff !== 'OSON') {
                    for (let i of empty) {
                        let test = [...game.board]; test[i] = 'X';
                        if (checkWin(test, game.gridSize)?.p === 'X') { move = i; break; }
                    }
                }
            }

            game.board[move] = 'O';
            const winRes = checkWin(game.board, game.gridSize);
            if (winRes) game.winner = winRes;
            else game.isXNext = true;

            game.isThinking = false;
            render();
        }

        // --- PROGRESSION & BOSS ---
        window.handleContinue = () => {
            if (game.winner?.p === 'X' && game.bossHP > 1) {
                game.bossHP--;
                initGame();
                return;
            }

            if (game.winner?.p === 'X') {
                if (game.mode === 'battle') {
                    state.coins += game.level * 30;
                    if (game.level >= state.unlockedLevel) state.unlockedLevel = game.level + 1;
                } else if (game.mode === 'robot') {
                    state.coins += 40;
                } else if (game.mode === 'multi') {
                    state.multiData.coinsX += 50;
                }
            } else if (game.winner?.p === 'O' && game.mode === 'multi') {
                state.multiData.coinsO += 50;
            }

            save();
            nav(game.mode === 'battle' ? 'map' : 'menu');
        };

        // --- SHOP & ARTEFAKTLAR ---
        window.useArt = (art, player = null) => {
            if (game.isThinking || game.winner) return;
            const currentP = game.isXNext ? 'X' : 'O';
            if (player && player !== currentP) return;

            const inv = game.mode === 'multi' ? (currentP === 'X' ? state.multiData.invX : state.multiData.invO) : state.inventory;
            if (inv[art] > 0) {
                if (art === 'eraser' || art === 'shield') {
                    game.activeArt = game.activeArt === art ? null : art;
                } else if (art === 'freeze') {
                    game.frozen = game.isXNext ? 'O' : 'X';
                    inv.freeze--;
                    game.activeArt = null;
                }
                render();
            }
        };

        window.buy = (item, player = 'X') => {
            const price = PRICES[item];
            if (game.mode === 'multi') {
                const cKey = player === 'X' ? 'coinsX' : 'coinsO';
                const iKey = player === 'X' ? 'invX' : 'invO';
                if (state.multiData[cKey] >= price) {
                    state.multiData[cKey] -= price;
                    state.multiData[iKey][item]++;
                }
            } else {
                if (state.coins >= price) {
                    state.coins -= price;
                    state.inventory[item]++;
                }
            }
            save(); render();
        };

        // --- RENDERING ---
        function render() {
            const ui = document.getElementById('ui');
            let html = '';

            if (state.view === 'menu') {
                html = `
                    <div class="flex-1 flex flex-col items-center justify-center space-y-10 animate-in fade-in">
                        <div class="text-center">
                            <h1 class="text-7xl font-black italic bg-clip-text text-transparent bg-gradient-to-tr from-blue-500 to-indigo-500">X & O</h1>
                            <p class="text-[10px] font-bold tracking-[0.4em] opacity-30 uppercase tracking-widest">PRO EDITION</p>
                        </div>
                        <div class="w-full space-y-4">
                            <button onclick="nav('map')" class="w-full bg-indigo-600 p-6 rounded-[2rem] font-black text-xl shadow-xl flex items-center justify-between hover:scale-105 transition-transform">KOMPANIYA <i data-lucide="map"></i></button>
                            <button onclick="nav('setup_robot')" class="w-full bg-slate-900 border border-white/5 p-5 rounded-[2rem] font-bold flex items-center justify-between">ROBOT BILAN <i data-lucide="cpu"></i></button>
                            <button onclick="nav('setup_multi')" class="w-full bg-slate-900 border border-white/5 p-5 rounded-[2rem] font-bold flex items-center justify-between text-indigo-400">MULTIPLAYER <i data-lucide="users"></i></button>
                            <div class="grid grid-cols-2 gap-3">
                                <button onclick="nav('shop')" class="p-4 bg-slate-900 border border-white/5 rounded-3xl font-bold flex items-center justify-center gap-2"><i data-lucide="shopping-cart" class="w-4"></i> DO'KON</button>
                                <button onclick="if(confirm('Progressni o\\'chirasizmi?')){localStorage.clear(); location.reload();}" class="p-4 bg-slate-900 border border-white/5 rounded-3xl font-bold flex items-center justify-center gap-2 text-red-400"><i data-lucide="trash-2" class="w-4"></i> O'CHIRISH</button>
                            </div>
                        </div>
                    </div>
                `;
            } else if (state.view === 'map') {
                html = `
                    <div class="flex flex-col h-full animate-in slide-in-from-right">
                        <div class="flex items-center justify-between mb-8">
                            <button onclick="nav('menu')" class="p-3 bg-slate-900 rounded-full"><i data-lucide="arrow-left"></i></button>
                            <div class="bg-yellow-500/10 text-yellow-500 px-5 py-2 rounded-full font-black flex items-center gap-2"><i data-lucide="coins" class="w-4"></i> ${state.coins}</div>
                        </div>
                        <h2 class="text-4xl font-black mb-6 italic uppercase tracking-tighter">Xarita</h2>
                        <div class="grid gap-3 overflow-y-auto pb-10 pr-1">
                            ${Array.from({length: 30}, (_, i) => i + 1).map(l => {
                                const locked = l > state.unlockedLevel;
                                const isBoss = BOSS_LEVELS.includes(l);
                                return `
                                    <button ${locked ? 'disabled' : `onclick="startLevel(${l})"`} class="p-6 rounded-[2.5rem] border-4 flex items-center justify-between transition-all ${locked ? 'opacity-10' : isBoss ? 'boss-card bg-red-600/10' : 'border-indigo-600 bg-indigo-600/5'}">
                                        <div class="flex items-center gap-5">
                                            <span class="text-4xl font-black">${l}</span>
                                            <div class="text-left"><div class="text-[10px] font-bold opacity-50 uppercase">${isBoss ? 'Boss' : 'Level'}</div><div class="font-bold">BATTLE</div></div>
                                        </div>
                                        ${locked ? '<i data-lucide="lock" class="w-5"></i>' : isBoss ? '<i data-lucide="skull" class="text-red-500 w-8 h-8"></i>' : '<i data-lucide="chevron-right"></i>'}
                                    </button>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            } else if (state.view.startsWith('setup')) {
                const isMulti = state.view.includes('multi');
                html = `
                    <div class="space-y-12 animate-in slide-in-from-bottom">
                        <button onclick="nav('menu')" class="p-3 bg-slate-900 rounded-full"><i data-lucide="arrow-left"></i></button>
                        <h2 class="text-3xl font-black italic uppercase tracking-tighter">${isMulti ? 'Multiplayer' : 'Robot'} Rejimi</h2>
                        <div class="space-y-8">
                            <div>
                                <p class="text-[10px] font-black opacity-30 uppercase tracking-[0.2em] mb-4">Grid Hajmi</p>
                                <div class="grid grid-cols-3 gap-3">
                                    <button onclick="setupTemp.size=3; upSetupUI(this, 's')" class="s-setup p-5 bg-slate-900 rounded-3xl font-black border-2 border-transparent setup-btn-active">3x3</button>
                                    <button onclick="setupTemp.size=4; upSetupUI(this, 's')" class="s-setup p-5 bg-slate-900 rounded-3xl font-black border-2 border-transparent">4x4</button>
                                    <button onclick="setupTemp.size=5; upSetupUI(this, 's')" class="s-setup p-5 bg-slate-900 rounded-3xl font-black border-2 border-transparent">5x5</button>
                                </div>
                            </div>
                            ${!isMulti ? `
                            <div>
                                <p class="text-[10px] font-black opacity-30 uppercase tracking-[0.2em] mb-4">Robot Darajasi</p>
                                <div class="grid grid-cols-2 gap-2">
                                    ${DIFFICULTIES.map(d => `<button onclick="setupTemp.diff='${d}'; upSetupUI(this, 'd')" class="d-setup p-4 rounded-3xl border-2 font-bold text-xs ${d==='O\'RTA' ? 'setup-btn-active border-indigo-400' : 'bg-slate-900 border-transparent'}">${d}</button>`).join('')}
                                </div>
                            </div>
                            ` : ''}
                            <button onclick="${isMulti ? 'startMultiMode()' : 'startRobotMode()'}" class="w-full bg-white text-black p-6 rounded-[2.5rem] font-black text-xl shadow-2xl hover:bg-slate-200 active:scale-95 transition-all">BOSHLASH</button>
                        </div>
                    </div>
                `;
            } else if (state.view === 'game') {
                const isMulti = game.mode === 'multi';
                html = `
                    <div class="flex-1 flex flex-col items-center">
                        <div class="w-full flex items-center justify-between mb-4 bg-slate-900/50 p-4 rounded-3xl border border-white/5">
                            <button onclick="nav('menu')" class="p-2 opacity-50"><i data-lucide="home"></i></button>
                            <div class="text-center flex-1">
                                <div class="text-[8px] font-bold opacity-30 uppercase tracking-[0.4em]">${game.diff}</div>
                                <div class="font-black text-sm uppercase">${game.bossHP > 0 ? 'BOSS STAGE' : `STAGE`}</div>
                                ${game.bossHP > 0 ? `<div class="flex justify-center gap-1 mt-1">${[1,2,3].map(h => `<i data-lucide="heart" class="w-4 h-4 ${h <= game.bossHP ? 'text-red-500 fill-red-500' : 'text-slate-800'}"></i>`).join('')}</div>` : ''}
                            </div>
                            <button onclick="nav('shop')" class="p-2 bg-yellow-500 text-black rounded-full shadow-lg active:scale-90"><i data-lucide="shopping-cart" class="w-4"></i></button>
                        </div>

                        ${isMulti ? `
                        <div class="w-full mb-2 p-3 rounded-2xl border-2 transition-all ${game.isXNext ? 'player-active-glow' : 'opacity-20'}">
                            <div class="flex items-center justify-between mb-2">
                                <div class="flex items-center gap-2"><i data-lucide="x" class="text-blue-400"></i> <span class="text-[10px] font-black uppercase tracking-widest">Player X Inventari</span></div>
                                <span class="text-[10px] font-black text-yellow-500 tracking-tighter">🪙 ${state.multiData.coinsX}</span>
                            </div>
                            <div class="flex gap-2">${renderInv('X', state.multiData.invX)}</div>
                        </div>
                        ` : ''}

                        <div class="w-full flex justify-between mb-4 px-2">
                            <div class="w-[48%] p-3 rounded-2xl border-2 transition-all ${game.isXNext ? 'border-indigo-500 bg-indigo-500/10' : 'border-transparent opacity-20'}">
                                <div class="flex justify-center mb-1"><i data-lucide="x" class="text-indigo-400 w-8 h-8"></i></div>
                                <div class="text-center font-bold text-[9px] uppercase tracking-widest">PLAYER X</div>
                            </div>
                            <div class="w-[48%] p-3 rounded-2xl border-2 transition-all ${!game.isXNext ? 'border-red-500 bg-red-500/10' : 'border-transparent opacity-20'}">
                                <div class="flex justify-center mb-1"><i data-lucide="circle" class="text-red-400 w-8 h-8"></i></div>
                                <div class="text-center font-bold text-[9px] uppercase tracking-widest">${isMulti ? 'PLAYER O' : 'ROBOT'}</div>
                            </div>
                        </div>

                        <div class="grid gap-2 w-full aspect-square bg-slate-950 p-2 rounded-[2.5rem] border border-white/5 shadow-2xl" style="grid-template-columns: repeat(${game.gridSize}, 1fr)">
                            ${game.board.map((v, i) => `
                                <button onclick="cellClick(${i})" class="grid-cell bg-slate-900 rounded-[1.5rem] flex items-center justify-center relative ${game.winner?.line?.includes(i) ? 'win-animate z-10' : ''}">
                                    ${v === 'X' ? '<i data-lucide="x" class="text-indigo-400 w-12 h-12"></i>' : v === 'O' ? '<i data-lucide="circle" class="text-red-400 w-12 h-12"></i>' : ''}
                                    ${game.shielded.includes(i) ? '<i data-lucide="shield-check" class="absolute top-2 right-2 text-emerald-500 w-4 h-4 animate-pulse"></i>' : ''}
                                </button>
                            `).join('')}
                        </div>

                        ${isMulti ? `
                        <div class="w-full mt-4 p-3 rounded-2xl border-2 transition-all ${!game.isXNext ? 'player-active-glow' : 'opacity-20'}">
                            <div class="flex items-center justify-between mb-2">
                                <div class="flex items-center gap-2"><i data-lucide="circle" class="text-red-400"></i> <span class="text-[10px] font-black uppercase tracking-widest">Player O Inventari</span></div>
                                <span class="text-[10px] font-black text-yellow-500 tracking-tighter">🪙 ${state.multiData.coinsO}</span>
                            </div>
                            <div class="flex gap-2">${renderInv('O', state.multiData.invO)}</div>
                        </div>
                        ` : `
                        <div class="mt-8 grid grid-cols-4 gap-3 w-full">
                            ${['eraser', 'freeze', 'shield', 'meteor'].map(art => `
                                <button onclick="useArt('${art}')" ${state.inventory[art] <= 0 || game.isThinking ? 'disabled' : ''} class="flex flex-col items-center p-4 rounded-3xl border-2 transition-all ${game.activeArt === art ? 'art-active' : 'bg-slate-900 border-slate-800'} ${state.inventory[art] <= 0 ? 'opacity-10' : ''}">
                                    <i data-lucide="${art==='eraser'?'eraser':art==='freeze'?'snowflake':art==='shield'?'shield-check':'sparkles'}" class="w-5 h-5 mb-1"></i>
                                    <span class="text-[10px] font-black">${state.inventory[art]}</span>
                                </button>
                            `).join('')}
                        </div>
                        `}
                    </div>

                    ${game.winner ? `
                        <div class="fixed inset-0 z-50 bg-black/95 backdrop-blur-xl flex flex-col items-center justify-center p-10 text-center animate-in zoom-in">
                            <i data-lucide="${game.winner.p === 'X' ? 'trophy' : game.winner.p === 'Durang' ? 'minus' : 'skull'}" class="w-24 h-24 mb-6 ${game.winner.p === 'X' ? 'text-yellow-400 animate-bounce' : 'text-red-500'}"></i>
                            <h2 class="text-5xl font-black ${game.winner.p === 'X' ? 'text-indigo-400' : 'text-red-500'} mb-2 italic tracking-tighter uppercase">${game.winner.p === 'Durang' ? 'DURANG' : game.winner.p === 'X' ? 'G\'ALABA' : 'MAG\'LUBIYAT'}</h2>
                            ${game.bossHP > 0 && game.winner.p === 'X' ? `<p class="opacity-50 text-sm">Bossning yana ${game.bossHP} joni qoldi!</p>` : ''}
                            <button onclick="handleContinue()" class="px-16 py-5 bg-indigo-600 rounded-full font-black text-xl shadow-2xl mt-10 hover:scale-105 active:scale-95 transition-transform">DAVOM ETISH</button>
                        </div>
                    ` : ''}
                `;
            } else if (state.view === 'shop') {
                const isMulti = game.mode === 'multi';
                html = `
                    <div class="space-y-10 animate-in fade-in">
                        <div class="flex justify-between items-center">
                            <button onclick="nav('game')" class="p-3 bg-slate-900 rounded-full"><i data-lucide="arrow-left"></i></button>
                            <h2 class="text-3xl font-black italic uppercase tracking-tighter">Bozor</h2>
                        </div>
                        <div class="space-y-6">
                            ${isMulti ? `
                                <div class="bg-blue-600/10 p-4 rounded-3xl border border-blue-500/20">
                                    <p class="text-xs font-black text-blue-400 mb-4 uppercase tracking-widest">Player X (🪙 ${state.multiData.coinsX})</p>
                                    <div class="grid gap-2">${renderShopItems('X')}</div>
                                </div>
                                <div class="bg-red-600/10 p-4 rounded-3xl border border-red-500/20">
                                    <p class="text-xs font-black text-red-400 mb-4 uppercase tracking-widest">Player O (🪙 ${state.multiData.coinsO})</p>
                                    <div class="grid gap-2">${renderShopItems('O')}</div>
                                </div>
                            ` : `
                                <div class="bg-yellow-500/10 p-4 rounded-3xl border border-yellow-500/20 mb-4">
                                    <p class="text-xs font-black text-yellow-500 mb-2 uppercase tracking-widest">Sizda: 🪙 ${state.coins}</p>
                                </div>
                                <div class="grid gap-2">${renderShopItems('X')}</div>
                            `}
                        </div>
                    </div>
                `;
            }

            ui.innerHTML = html;
            lucide.createIcons();
        }

        function renderInv(player, inv) {
            return ['eraser', 'freeze', 'shield'].map(art => `
                <button onclick="useArt('${art}', '${player}')" ${inv[art] <= 0 || (game.isXNext ? 'X':'O') !== player ? 'disabled' : ''} class="flex-1 flex items-center justify-center gap-1 px-3 py-2 rounded-xl border-2 transition-all ${game.activeArt === art && (game.isXNext ? 'X':'O') === player ? 'art-active' : 'bg-slate-800 border-slate-700'} ${inv[art] <= 0 ? 'opacity-10' : ''}">
                    <i data-lucide="${art==='eraser'?'eraser':art==='freeze'?'snowflake':'shield-check'}" class="w-3 h-3"></i>
                    <span class="text-[9px] font-bold">${inv[art]}</span>
                </button>
            `).join('');
        }

        function renderShopItems(player) {
            const isMulti = game.mode === 'multi';
            const coins = isMulti ? (player === 'X' ? state.multiData.coinsX : state.multiData.coinsO) : state.coins;
            return Object.entries(PRICES).map(([k, v]) => `
                <div class="bg-slate-900 p-4 rounded-2xl border border-white/5 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <i data-lucide="${k==='eraser'?'eraser':k==='freeze'?'snowflake':k==='shield'?'shield-check':'sparkles'}" class="w-5 h-5"></i>
                        <span class="font-bold capitalize text-sm">${k}</span>
                    </div>
                    <button onclick="buy('${k}', '${player}')" ${coins < v ? 'disabled' : ''} class="px-4 py-2 bg-yellow-500 text-black rounded-xl font-black text-[10px] ${coins < v ? 'opacity-20' : 'active:scale-95 transition-transform'}">${v} 🪙</button>
                </div>
            `).join('');
        }

        window.upSetupUI = (el, type) => {
            const cls = type === 's' ? '.s-setup' : '.d-setup';
            document.querySelectorAll(cls).forEach(b => {
                b.classList.remove('setup-btn-active');
                b.classList.replace('border-indigo-400', 'border-transparent');
            });
            el.classList.add('setup-btn-active');
            if(type === 'd') el.classList.replace('border-transparent', 'border-indigo-400');
        };

        render();
    </script>
</body>
</html>
