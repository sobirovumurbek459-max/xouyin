<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X & O Legend - Battle Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .neon-text {
            text-shadow: 0 0 10px rgba(34, 211, 238, 0.8), 0 0 20px rgba(34, 211, 238, 0.4);
        }

        .grid-cell {
            aspect-ratio: 1 / 1;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 10px; }

        .animate-pop { animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .boss-shake { animation: shake 0.5s infinite; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }
    </style>
</head>
<body class="transition-colors duration-500">
    <div id="app"></div>

    <script>
        // --- KONSTANTALAR ---
        const BOSS_LEVELS = [5, 10, 15, 20, 25, 30];
        const PRICES = {
            standard: { eraser: 30, freeze: 50, shield: 40, zap: 80 },
            elite: { eraser: 40, freeze: 60, shield: 50, zap: 100, meteor: 150, rewind: 130, ghost: 180 }
        };

        // --- GLOBAL HOLAT ---
        let state = {
            view: 'menu',
            gameMode: 'battle',
            settings: { music: false, theme: 'dark', icons: 'classic' },
            currentLevel: 1,
            bossHP: 3,
            gridSize: 3,
            board: [],
            history: [],
            isXNext: true,
            winnerInfo: null,
            turnCount: 0,
            frozenPlayer: null,
            shielded: [],
            activeArtifact: null,
            
            // Profillar
            battleProfile: { coins: 250, unlockedLevel: 1, inventory: { eraser: 3, freeze: 2, shield: 2, zap: 1, meteor: 1, rewind: 1, ghost: 0 } },
            multiProfile: { coinsX: 100, coinsO: 100, invX: { eraser: 1, freeze: 1, shield: 1, zap: 0 }, invO: { eraser: 1, freeze: 1, shield: 1, zap: 0 } },
            pveProfile: { coins: 100, inventory: { eraser: 1, freeze: 1, shield: 1, zap: 0 } }
        };

        // --- MANTIQIY FUNKSIYALAR ---
        function getWinLength(size) { return size === 3 ? 3 : 4; }

        function checkWinner(squares, size, winLen) {
            const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    let player = squares[r * size + c];
                    if (!player) continue;
                    for (let [dr, dc] of dirs) {
                        let count = 1;
                        let line = [r * size + c];
                        for (let step = 1; step < winLen; step++) {
                            let nr = r + dr * step, nc = c + dc * step;
                            if (nr >= 0 && nr < size && nc >= 0 && nc < size && squares[nr * size + nc] === player) {
                                count++; line.push(nr * size + nc);
                            } else break;
                        }
                        if (count === winLen) return { winner: player, line };
                    }
                }
            }
            if (!squares.includes(null)) return { winner: 'Draw', line: [] };
            return null;
        }

        function getAIMove(squares, size, winLen) {
            const empty = squares.map((v, i) => (v === null ? i : null)).filter((v) => v !== null);
            if (empty.length === 0) return null;
            const checkMove = (p, len) => {
                for (let i of empty) {
                    const temp = [...squares]; temp[i] = p;
                    if (checkWinner(temp, size, len)?.winner === p) return i;
                }
                return null;
            };
            const winMove = checkMove('O', winLen);
            if (winMove !== null) return winMove;
            const blockMove = checkMove('X', winLen);
            if (blockMove !== null) return blockMove;
            return empty[Math.floor(Math.random() * empty.length)];
        }

        // --- BOSHQARUV ---
        function setView(v) { state.view = v; render(); }

        function startNewGame(mode, lvl = 1) {
            state.gameMode = mode;
            state.currentLevel = lvl;
            state.gridSize = mode === 'battle' ? (lvl <= 10 ? 3 : lvl <= 20 ? 4 : 5) : 3;
            state.board = Array(state.gridSize * state.gridSize).fill(null);
            state.history = [];
            state.isXNext = true;
            state.winnerInfo = null;
            state.turnCount = 0;
            state.shielded = [];
            state.activeArtifact = null;
            state.frozenPlayer = null;
            if (BOSS_LEVELS.includes(lvl)) state.bossHP = 3;
            state.view = 'playing';
            render();
        }

        function handleMove(i, isHuman = true) {
            if (state.winnerInfo) return;
            const p = state.isXNext ? 'X' : 'O';
            const opp = state.isXNext ? 'O' : 'X';

            // Artifakt Logic
            if (state.activeArtifact === 'eraser' && isHuman) {
                if (state.board[i] === opp && !state.shielded.includes(i)) {
                    state.board[i] = null;
                    updateInventory(p, 'eraser', -1);
                    state.activeArtifact = null;
                    render();
                    return;
                }
            }
            if (state.activeArtifact === 'shield' && isHuman) {
                if (state.board[i] === p && !state.shielded.includes(i)) {
                    state.shielded.push(i);
                    updateInventory(p, 'shield', -1);
                    state.activeArtifact = null;
                    render();
                    return;
                }
            }

            if (state.board[i]) return;

            state.history.push([...state.board]);
            state.board[i] = p;
            state.turnCount++;

            const winLen = getWinLength(state.gridSize);
            const result = checkWinner(state.board, state.gridSize, winLen);

            if (result) {
                state.winnerInfo = result;
                if (result.winner === 'X') processVictory();
            } else {
                if (state.frozenPlayer === opp) state.frozenPlayer = null;
                else state.isXNext = !state.isXNext;
            }
            render();

            // AI Move
            if (state.view === 'playing' && !state.isXNext && !state.winnerInfo && state.gameMode !== 'multiplayer') {
                setTimeout(() => {
                    const move = getAIMove(state.board, state.gridSize, getWinLength(state.gridSize));
                    if (move !== null) handleMove(move, false);
                }, 800);
            }
        }

        function processVictory() {
            const reward = state.currentLevel * 10 + (BOSS_LEVELS.includes(state.currentLevel) ? 50 : 0);
            if (state.gameMode === 'battle') {
                if (BOSS_LEVELS.includes(state.currentLevel)) {
                    state.bossHP--;
                    if (state.bossHP > 0) {
                        setTimeout(() => {
                            state.board = Array(state.gridSize * state.gridSize).fill(null);
                            state.winnerInfo = null;
                            state.isXNext = true;
                            render();
                        }, 1500);
                        return;
                    }
                }
                state.battleProfile.coins += reward;
                state.battleProfile.unlockedLevel = Math.max(state.battleProfile.unlockedLevel, state.currentLevel + 1);
            } else if (state.gameMode === 'multiplayer') {
                state.multiProfile.coinsX += 40;
            } else {
                state.pveProfile.coins += 30;
            }
        }

        function updateInventory(player, item, amount) {
            if (state.gameMode === 'battle') {
                state.battleProfile.inventory[item] += amount;
            } else if (state.gameMode === 'multiplayer') {
                const profile = player === 'X' ? state.multiProfile.invX : state.multiProfile.invO;
                profile[item] += amount;
            } else {
                state.pveProfile.inventory[item] += amount;
            }
        }

        function usePower(p, owner) {
            const currentPlayer = state.isXNext ? 'X' : 'O';
            if (owner !== currentPlayer || state.winnerInfo) return;

            const inv = state.gameMode === 'battle' ? state.battleProfile.inventory : 
                        state.gameMode === 'multiplayer' ? (owner === 'X' ? state.multiProfile.invX : state.multiProfile.invO) : 
                        state.pveProfile.inventory;

            if (inv[p] <= 0) return;

            if (p === 'eraser' || p === 'shield') {
                state.activeArtifact = (state.activeArtifact === p) ? null : p;
            } else if (p === 'freeze') {
                state.frozenPlayer = (state.isXNext ? 'O' : 'X');
                updateInventory(owner, 'freeze', -1);
            } else if (p === 'rewind' && state.history.length > 0) {
                state.board = state.history.pop();
                updateInventory(owner, 'rewind', -1);
            } else if (p === 'meteor') {
                const opp = owner === 'X' ? 'O' : 'X';
                const oppCells = state.board.map((v, i) => v === opp ? i : null).filter(v => v !== null);
                if (oppCells.length > 0) {
                    const r = Math.floor(Math.random() * oppCells.length);
                    state.board[oppCells[r]] = null;
                    updateInventory(owner, 'meteor', -1);
                }
            }
            render();
        }

        function buyItem(player, item, price) {
            let profile = state.gameMode === 'battle' ? state.battleProfile : 
                          state.gameMode === 'multiplayer' ? state.multiProfile : state.pveProfile;
            
            if (state.gameMode === 'multiplayer') {
                const coinsKey = player === 'X' ? 'coinsX' : 'coinsO';
                const invKey = player === 'X' ? 'invX' : 'invO';
                if (profile[coinsKey] >= price) {
                    profile[coinsKey] -= price;
                    profile[invKey][item]++;
                }
            } else {
                if (profile.coins >= price) {
                    profile.coins -= price;
                    profile.inventory[item]++;
                }
            }
            render();
        }

        // --- RENDERER ---
        function getThemeClasses() {
            if (state.settings.theme === 'light') return "bg-slate-50 text-slate-900 border-slate-200";
            if (state.settings.theme === 'neon') return "bg-black text-cyan-400 border-cyan-900";
            return "bg-slate-900 text-slate-100 border-slate-800";
        }

        function getIcon(val, size = 32) {
            if (!val) return '';
            const isX = val === 'X';
            const color = isX ? "text-blue-500" : "text-red-500";
            let iconName = isX ? "x" : "circle";
            
            if (state.settings.icons === 'fantasy') iconName = isX ? "swords" : "shield-alert";
            if (state.settings.icons === 'elements') {
                return isX ? `<i data-lucide="flame" class="text-orange-500" style="width:${size}px;height:${size}px"></i>` : 
                             `<i data-lucide="droplets" class="text-blue-500" style="width:${size}px;height:${size}px"></i>`;
            }
            return `<i data-lucide="${iconName}" class="${color}" style="width:${size}px;height:${size}px"></i>`;
        }

        function render() {
            const app = document.getElementById('app');
            const theme = getThemeClasses();
            document.body.className = theme.split(' ')[0];

            if (state.view === 'menu') {
                app.innerHTML = `
                    <div class="min-h-screen flex flex-col items-center justify-center p-6 ${theme}">
                        <h1 class="text-5xl md:text-7xl font-black italic mb-12 bg-clip-text text-transparent bg-gradient-to-br from-blue-400 to-indigo-600 text-center uppercase">X & O Legend</h1>
                        <div class="w-full max-w-sm space-y-4">
                            <button onclick="setView('map')" class="w-full bg-indigo-600 p-6 rounded-3xl shadow-xl flex items-center justify-between font-black text-white hover:scale-105 transition-all">
                                KOMPANIYA (30 LVL) <i data-lucide="map"></i>
                            </button>
                            <button onclick="startNewGame('multiplayer')" class="w-full bg-white/5 p-5 border-2 border-current rounded-3xl flex items-center justify-between font-bold hover:bg-white/10 transition-all">
                                MULTIPLAYER <i data-lucide="users"></i>
                            </button>
                            <button onclick="startNewGame('pve')" class="w-full bg-white/5 p-5 border-2 border-current rounded-3xl flex items-center justify-between font-bold hover:bg-white/10 transition-all">
                                VS ROBOT <i data-lucide="cpu"></i>
                            </button>
                            <button onclick="setView('settings')" class="w-full p-4 bg-white/5 border-2 border-current/10 rounded-2xl font-bold opacity-60 flex items-center justify-center gap-2">
                                <i data-lucide="settings" size="20"></i> SOZLAMALAR
                            </button>
                        </div>
                    </div>
                `;
            } else if (state.view === 'settings') {
                app.innerHTML = `
                    <div class="min-h-screen p-8 ${theme}">
                        <div class="max-w-md mx-auto">
                            <button onclick="setView('menu')" class="mb-8 font-black flex items-center gap-2 opacity-50"><i data-lucide="home"></i> MENYU</button>
                            <h2 class="text-4xl font-black mb-10 uppercase italic">Sozlamalar</h2>
                            <div class="space-y-6">
                                <div class="bg-white/5 p-6 rounded-3xl">
                                    <h3 class="text-xs font-black opacity-40 uppercase mb-4">Mavzu</h3>
                                    <div class="flex gap-2">
                                        ${['light', 'dark', 'neon'].map(t => `
                                            <button onclick="state.settings.theme='${t}'; render()" class="flex-1 py-3 rounded-2xl font-black uppercase text-[10px] border-2 transition-all ${state.settings.theme === t ? 'border-blue-500 bg-blue-500/10' : 'border-transparent bg-white/5'}">${t}</button>
                                        `).join('')}
                                    </div>
                                </div>
                                <div class="bg-white/5 p-6 rounded-3xl">
                                    <h3 class="text-xs font-black opacity-40 uppercase mb-4">Ramzlar</h3>
                                    <div class="grid grid-cols-3 gap-2">
                                        ${['classic', 'fantasy', 'elements'].map(s => `
                                            <button onclick="state.settings.icons='${s}'; render()" class="p-4 rounded-2xl border-2 font-black uppercase text-[10px] transition-all ${state.settings.icons === s ? 'border-blue-500 bg-blue-500/10' : 'border-transparent bg-white/5'}">${s}</button>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (state.view === 'map') {
                app.innerHTML = `
                    <div class="min-h-screen p-6 overflow-y-auto ${theme}">
                        <div class="max-w-md mx-auto">
                            <button onclick="setView('menu')" class="mb-6 font-black opacity-50 flex items-center gap-2"><i data-lucide="home"></i> MENYU</button>
                            <div class="flex items-center justify-between mb-8">
                                <h2 class="text-4xl font-black italic uppercase">Xarita</h2>
                                <div class="flex items-center gap-2 bg-yellow-500/20 px-4 py-2 rounded-full font-black text-yellow-500"><i data-lucide="coins"></i> ${state.battleProfile.coins}</div>
                            </div>
                            <div class="grid gap-3 pb-10">
                                ${Array.from({ length: 30 }, (_, i) => i + 1).map(lvl => {
                                    const locked = lvl > state.battleProfile.unlockedLevel;
                                    const isBoss = BOSS_LEVELS.includes(lvl);
                                    return `
                                        <button ${locked ? 'disabled' : ''} onclick="startNewGame('battle', ${lvl})" class="w-full p-6 rounded-3xl border-4 flex items-center justify-between transition-all ${locked ? 'opacity-20 border-slate-800' : isBoss ? 'border-red-600 bg-red-600/10' : 'border-indigo-500 bg-indigo-500/5'}">
                                            <div class="flex items-center gap-4">
                                                <span class="text-3xl font-black">${lvl}</span>
                                                <span class="font-black uppercase">${isBoss ? "BOSS" : "BOSQICH"}</span>
                                            </div>
                                            ${isBoss ? `<i data-lucide="skull" class="${locked ? '' : 'text-red-500'}"></i>` : `<i data-lucide="chevron-right"></i>`}
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                `;
            } else if (state.view === 'playing') {
                const isBattle = state.gameMode === 'battle';
                const isMulti = state.gameMode === 'multiplayer';
                const isBoss = BOSS_LEVELS.includes(state.currentLevel) && isBattle;
                
                app.innerHTML = `
                    <div class="min-h-screen flex flex-col items-center p-4 ${theme}">
                        <div class="w-full max-w-lg mb-4 flex items-center justify-between bg-white/5 p-4 rounded-3xl border-2 border-current/10">
                            <button onclick="setView('${isBattle ? 'map' : 'menu'}')" class="p-2 bg-white/10 rounded-full"><i data-lucide="home"></i></button>
                            <div class="text-center">
                                <div class="text-[10px] font-black opacity-40 uppercase tracking-widest">${state.gameMode}</div>
                                <div class="font-black text-sm">${isBoss ? `BOSS HP: ${state.bossHP}` : `LVL ${state.currentLevel}`}</div>
                            </div>
                            <button onclick="setView('shop')" class="p-2 bg-yellow-500 text-black rounded-full shadow-lg"><i data-lucide="shopping-cart"></i></button>
                        </div>

                        ${isBoss ? `
                            <div class="flex gap-2 mb-4 boss-shake">
                                ${Array.from({ length: 3 }).map((_, i) => `<i data-lucide="heart" class="${i < state.bossHP ? "text-red-500 fill-red-500" : "text-slate-800"}"></i>`).join('')}
                            </div>
                        ` : ''}

                        <div class="w-full max-w-md flex justify-between mb-8 px-2">
                            <div class="flex flex-col items-center p-4 rounded-3xl border-2 w-[48%] transition-all ${state.isXNext && !state.winnerInfo ? 'border-blue-500 bg-blue-500/10 scale-105 ring-4 ring-blue-500/20' : 'border-transparent opacity-40'}">
                                ${getIcon('X', 40)}
                                <div class="text-[10px] font-black mt-2">PLAYER X</div>
                                <div class="text-yellow-500 font-black text-xs">${isBattle ? state.battleProfile.coins : isMulti ? state.multiProfile.coinsX : state.pveProfile.coins} 🪙</div>
                            </div>
                            <div class="flex flex-col items-center p-4 rounded-3xl border-2 w-[48%] transition-all ${!state.isXNext && !state.winnerInfo ? 'border-red-500 bg-red-500/10 scale-105 ring-4 ring-red-500/20' : 'border-transparent opacity-40'}">
                                ${getIcon('O', 40)}
                                <div class="text-[10px] font-black mt-2">${isMulti ? "PLAYER O" : "ROBOT"}</div>
                                <div class="text-yellow-500 font-black text-xs">${isMulti ? state.multiProfile.coinsO : 0} 🪙</div>
                            </div>
                        </div>

                        <div class="grid gap-2 sm:gap-3 bg-white/5 p-3 rounded-[3rem] border-2 border-current/10 w-full max-w-md aspect-square mb-6" style="grid-template-columns: repeat(${state.gridSize}, 1fr)">
                            ${state.board.map((val, i) => `
                                <button onclick="handleMove(${i})" class="grid-cell flex items-center justify-center rounded-2xl transition-all relative ${!val && !state.winnerInfo ? 'bg-white/5 hover:bg-white/10' : 'bg-white/10'} ${state.winnerInfo?.line?.includes(i) ? 'bg-indigo-600 ring-4 ring-white' : ''}">
                                    <div class="animate-pop">${getIcon(val, state.gridSize > 4 ? 24 : 36)}</div>
                                    ${state.shielded.includes(i) ? '<i data-lucide="shield-check" class="absolute top-1 right-1 text-emerald-500 animate-bounce" style="width:16px;height:16px"></i>' : ''}
                                </button>
                            `).join('')}
                        </div>

                        <div class="w-full max-w-md space-y-4">
                            ${isMulti ? renderMultiInv() : renderSingleInv()}
                        </div>

                        ${state.winnerInfo ? `
                            <div class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex flex-col items-center justify-center p-10 text-center">
                                ${state.winnerInfo.winner === 'X' ? '<i data-lucide="trophy" class="text-yellow-400 mb-6" style="width:100px;height:100px"></i><h2 class="text-5xl font-black text-green-400 mb-4 uppercase">G\'alaba!</h2>' : 
                                  state.winnerInfo.winner === 'Draw' ? '<div class="text-8xl mb-6">🤝</div><h2 class="text-5xl font-black mb-4 uppercase">Durang!</h2>' : 
                                  '<i data-lucide="skull" class="text-red-500 mb-6" style="width:100px;height:100px"></i><h2 class="text-5xl font-black text-red-500 mb-4 uppercase italic">Mag\'lubiyat!</h2>'}
                                <button onclick="setView('${isBattle ? 'map' : 'menu'}')" class="px-12 py-5 bg-blue-600 text-white rounded-full font-black text-xl shadow-xl hover:scale-105 transition-all">DAVOM ETISH</button>
                            </div>
                        ` : ''}
                    </div>
                `;
            } else if (state.view === 'shop') {
                const isBattle = state.gameMode === 'battle';
                const prices = isBattle ? PRICES.elite : PRICES.standard;
                
                app.innerHTML = `
                    <div class="min-h-screen p-8 ${theme}">
                        <div class="max-w-md mx-auto">
                            <button onclick="setView('playing')" class="mb-6 font-black flex items-center gap-2 opacity-50"><i data-lucide="chevron-left"></i> ORTGA</button>
                            <h2 class="text-4xl font-black italic uppercase mb-8 border-b-2 border-current pb-4">${isBattle ? "ELITE BOZOR" : "MARKET"}</h2>
                            <div class="space-y-6">
                                ${renderShopSection('X', prices)}
                                ${state.gameMode === 'multiplayer' ? renderShopSection('O', prices) : ''}
                            </div>
                        </div>
                    </div>
                `;
            }
            lucide.createIcons();
        }

        function renderSingleInv() {
            const isBattle = state.gameMode === 'battle';
            const inv = isBattle ? state.battleProfile.inventory : state.pveProfile.inventory;
            return `
                <div class="grid grid-cols-4 sm:grid-cols-7 gap-2">
                    ${renderPowerBtn('eraser', inv.eraser, 'pink')}
                    ${renderPowerBtn('freeze', inv.freeze, 'cyan')}
                    ${renderPowerBtn('shield', inv.shield, 'emerald')}
                    ${renderPowerBtn('zap', inv.zap, 'orange')}
                    ${isBattle ? `
                        ${renderPowerBtn('meteor', inv.meteor, 'purple')}
                        ${renderPowerBtn('rewind', inv.rewind, 'blue')}
                        ${renderPowerBtn('ghost', inv.ghost, 'slate')}
                    ` : ''}
                </div>
            `;
        }

        function renderMultiInv() {
            return `
                <div class="space-y-4">
                    <div class="p-4 rounded-3xl border-2 ${state.isXNext ? 'border-blue-500 bg-blue-500/5' : 'opacity-50'}">
                        <p class="text-[10px] font-black text-blue-500 mb-2 tracking-widest uppercase">X Inventari</p>
                        <div class="grid grid-cols-4 gap-2">
                            ${renderPowerBtn('eraser', state.multiProfile.invX.eraser, 'pink', 'X')}
                            ${renderPowerBtn('freeze', state.multiProfile.invX.freeze, 'cyan', 'X')}
                            ${renderPowerBtn('shield', state.multiProfile.invX.shield, 'emerald', 'X')}
                            ${renderPowerBtn('zap', state.multiProfile.invX.zap, 'orange', 'X')}
                        </div>
                    </div>
                    <div class="p-4 rounded-3xl border-2 ${!state.isXNext ? 'border-red-500 bg-red-500/5' : 'opacity-50'}">
                        <p class="text-[10px] font-black text-red-500 mb-2 tracking-widest uppercase">O Inventari</p>
                        <div class="grid grid-cols-4 gap-2">
                            ${renderPowerBtn('eraser', state.multiProfile.invO.eraser, 'pink', 'O')}
                            ${renderPowerBtn('freeze', state.multiProfile.invO.freeze, 'cyan', 'O')}
                            ${renderPowerBtn('shield', state.multiProfile.invO.shield, 'emerald', 'O')}
                            ${renderPowerBtn('zap', state.multiProfile.invO.zap, 'orange', 'O')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderPowerBtn(p, count, color, owner = 'X') {
            const icons = { eraser: 'eraser', freeze: 'snowflake', shield: 'shield-check', zap: 'zap', meteor: 'sparkles', rewind: 'history', ghost: 'ghost' };
            const isActive = state.activeArtifact === p && ((owner === 'X' && state.isXNext) || (owner === 'O' && !state.isXNext));
            const colors = {
                pink: 'border-pink-500 text-pink-500', cyan: 'border-cyan-500 text-cyan-500', emerald: 'border-emerald-500 text-emerald-500',
                orange: 'border-orange-500 text-orange-500', purple: 'border-purple-500 text-purple-500', blue: 'border-blue-500 text-blue-500', slate: 'border-slate-500 text-slate-500'
            };
            return `
                <button onclick="usePower('${p}', '${owner}')" ${count <= 0 ? 'disabled' : ''} class="p-2 border-2 rounded-2xl flex flex-col items-center gap-1 transition-all ${isActive ? 'bg-current text-white scale-110 shadow-lg' : colors[color]} ${count <= 0 ? 'opacity-20 grayscale' : 'hover:scale-110 active:scale-95'}">
                    <i data-lucide="${icons[p]}" style="width:20px;height:20px"></i>
                    <span class="text-[9px] font-black">${count}</span>
                </button>
            `;
        }

        function renderShopSection(player, prices) {
            let coins = state.gameMode === 'battle' ? state.battleProfile.coins : (player === 'X' ? state.multiProfile.coinsX : state.multiProfile.coinsO);
            return `
                <div class="bg-white/5 p-6 rounded-3xl border-2 ${player === 'X' ? 'border-blue-500/20' : 'border-red-500/20'}">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-black ${player === 'X' ? 'text-blue-500' : 'text-red-500'} uppercase">PLAYER ${player}</h3>
                        <div class="text-yellow-500 font-black"><i data-lucide="coins" class="inline mb-1" style="width:16px;height:16px"></i> ${coins}</div>
                    </div>
                    <div class="grid gap-2">
                        ${Object.entries(prices).map(([item, price]) => `
                            <div class="flex items-center justify-between bg-white/5 p-4 rounded-2xl border border-white/5">
                                <div class="flex items-center gap-3">
                                    <div class="p-2 bg-white/10 rounded-xl"><i data-lucide="${item === 'eraser' ? 'eraser' : item === 'freeze' ? 'snowflake' : item === 'shield' ? 'shield-check' : item === 'zap' ? 'zap' : item === 'meteor' ? 'sparkles' : item === 'rewind' ? 'history' : 'ghost'}"></i></div>
                                    <div class="font-bold text-sm uppercase">${item}</div>
                                </div>
                                <button onclick="buyItem('${player}', '${item}', ${price})" ${coins < price ? 'disabled' : ''} class="px-5 py-2 rounded-xl font-black text-xs transition-all ${coins >= price ? 'bg-indigo-600 text-white shadow-lg' : 'bg-white/10 opacity-30'}">${price} 🪙</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // --- START ---
        window.onload = render;
    </script>
</body>
</html>
